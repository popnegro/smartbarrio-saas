name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start application
        run: npm run start -- --hostname 0.0.0.0 > /tmp/smartbarrio-next.log 2>&1 &

      - name: Wait for application
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3000/index.html
            http://127.0.0.1:3000/kioscos/
            http://127.0.0.1:3000/kioscos/nuovo-market
            http://127.0.0.1:3000/admin/
          uploadArtifacts: true
          temporaryPublicStorage: true
