name: Lighthouse CI · Stable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartbarrio-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start application
        run: npm run start -- --hostname 0.0.0.0 > /tmp/smartbarrio-next.log 2>&1 &

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/index.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/smartbarrio-next.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3000/index.html
            http://127.0.0.1:3000/kioscos/
            http://127.0.0.1:3000/kioscos/nuovo-market
            http://127.0.0.1:3000/admin/
          uploadArtifacts: true
          temporaryPublicStorage: true
