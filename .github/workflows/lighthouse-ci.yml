name: Preproduction · Lighthouse

on:
  push:
    branches: [preproduction]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartbarrio-preproduction-lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse · release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run start -- --hostname 0.0.0.0 > /tmp/smartbarrio-next.log 2>&1 &
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/index.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/smartbarrio-next.log
          exit 1
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3000/index.html
            http://127.0.0.1:3000/kioscos/
            http://127.0.0.1:3000/kioscos/nuovo-market
            http://127.0.0.1:3000/admin/
          uploadArtifacts: true
          temporaryPublicStorage: true
