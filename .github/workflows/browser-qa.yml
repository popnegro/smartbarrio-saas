name: Staging · Smoke QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartbarrio-staging
  cancel-in-progress: true

jobs:
  smoke:
    name: Staging smoke · routes + critical interactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run start -- --hostname 0.0.0.0 > /tmp/smartbarrio-next.log 2>&1 &
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/index.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/smartbarrio-next.log
          exit 1
      - run: npx playwright test tests/qa/staging-smoke.spec.js
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartbarrio-staging-smoke
          path: |
            playwright-report
            test-results
            /tmp/smartbarrio-next.log
          if-no-files-found: ignore
